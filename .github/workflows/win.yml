name: win-compressor
on:
  workflow_dispatch:
    inputs:
      tag: {description: 'release tag', required: true, default: 'tanzil-pc-v1'}
      release: {description: 'publish release', required: true, default: 'false'}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: 'x86'
      - name: functional test (source)
        shell: pwsh
        run: |
          cd win
          python ci_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: build exe
        shell: pwsh
        run: |
          python --version
          python -c "import struct;print(struct.calcsize('P')*8,'bit python')"
          pip install pyinstaller==5.13.2
          cd win
          $ucrt = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist\ucrt\DLLs\x86"
          "ucrt dir exists: $(Test-Path $ucrt)"
          $bins = @()
          Get-ChildItem $ucrt -Filter *.dll | ForEach-Object { $bins += '--add-binary'; $bins += "$($_.FullName);." }
          $vc = "$env:WINDIR\SysWOW64\vcruntime140.dll"
          "vcruntime exists: $(Test-Path $vc)"
          if (Test-Path $vc) { $bins += '--add-binary'; $bins += "$vc;." }
          "binary args: $($bins.Count / 2)"
          pyinstaller --onefile --windowed --name Tanzil-PC --icon icon.ico --add-data "icon.ico;." --add-data "bg_dark.png;." --add-data "bg_light.png;." --splash splash.png @bins tanzil_pc.py
          $n = (Get-ChildItem -Recurse build -Filter PKG-00.toc | Select-String -Pattern 'api-ms-win-crt|ucrtbase|vcruntime140' | Measure-Object).Count
          "crt/vcruntime entries in package: $n"
          Compress-Archive -Path dist\Tanzil-PC.exe -DestinationPath Tanzil-PC-win32.zip
          Get-ChildItem dist, Tanzil-PC-win32.zip | Format-Table Name, Length
      - name: selftest
        shell: pwsh
        run: |
          cd win\dist
          $p = Start-Process -FilePath .\Tanzil-PC.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          "exit $($p.ExitCode)"
      - name: robustness
        shell: pwsh
        run: |
          $exe = "$PWD\win\dist\Tanzil-PC.exe"
          function Probe($label, $path, $secs) {
            $p = Start-Process -FilePath $path -PassThru
            Start-Sleep -Seconds $secs
            $alive = -not $p.HasExited
            $all = Get-Process -Name 'Tanzil-PC' -ErrorAction SilentlyContinue
            $ws = [math]::Round((($all | Measure-Object WorkingSet64 -Sum).Sum)/1MB,1)
            $pm = [math]::Round((($all | Measure-Object PrivateMemorySize64 -Sum).Sum)/1MB,1)
            "$label alive=$alive procs=$($all.Count) workingset_MB=$ws private_MB=$pm"
            $all | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          # A: memory
          Probe 'RAM' $exe 10
          # B: arabic + spaces path
          $d = Join-Path $env:RUNNER_TEMP 'مجلد تجربة فيه مسافات'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item $exe "$d\Tanzil-PC.exe"
          Probe 'ARABIC_PATH' "$d\Tanzil-PC.exe" 8
          # C: unwritable APPDATA
          $env:APPDATA = 'Z:\nope\x'
          $d2 = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force $d2 | Out-Null
          Copy-Item $exe "$d2\Tanzil-PC.exe"
          Probe 'APPDATA_UNWRITABLE' "$d2\Tanzil-PC.exe" 8
          "fallback dir created next to exe: $(Test-Path "$d2\TanzilData")"
          # D: corrupt data file
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'ad'
          New-Item -ItemType Directory -Force "$env:APPDATA\TanzilPC" | Out-Null
          Set-Content -Path "$env:APPDATA\TanzilPC\data.json" -Value '{{{ corrupt'
          Probe 'CORRUPT_DATA' $exe 8
          "corrupt file moved to .bad: $(Test-Path "$env:APPDATA\TanzilPC\data.json.bad")"
          "crash.log exists: $(Test-Path "$env:APPDATA\TanzilPC\crash.log")"
      - name: gui screenshots
        shell: pwsh
        run: |
          cd win\dist
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $cfg = @(
            @('--tab','0','--theme','dark'),
            @('--tab','1','--theme','light'),
            @('--tab','2','--theme','dark'),
            @('--tab','3','--theme','dark'),
            @('--tab','4','--theme','light'),
            @('--tab','3','--theme','dark','--size','600x440'),
            @('--tab','0','--theme','light','--size','600x440')
          )
          $t = 0
          foreach ($c in $cfg) {
            $p = Start-Process -FilePath .\Tanzil-PC.exe -ArgumentList $c -PassThru
            Start-Sleep -Seconds 6
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\..\..\shot$t.png")
            "shot $t alive: $(-not $p.HasExited)"
            Stop-Process -Id $p.Id -Force
            $t++
          }
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shot*.png
      - name: release
        if: ${{ inputs.release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" win/Tanzil-PC-win32.zip win/dist/Tanzil-PC.exe --repo "${{ github.repository }}" --title "تنزيل PC" --notes "مدرب كتابة وتايمر مذاكرة، بدون إنترنت، 32 بت."
