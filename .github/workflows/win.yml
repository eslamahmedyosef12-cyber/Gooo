name: win-compressor
on:
  workflow_dispatch:
    inputs:
      tag: {description: 'release tag', required: true, default: 'tanzil-pc-v1'}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: 'x86'
      - name: functional test (source)
        shell: pwsh
        run: |
          cd win
          python ci_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: build exe
        shell: pwsh
        run: |
          python --version
          python -c "import struct;print(struct.calcsize('P')*8,'bit python')"
          pip install pyinstaller==5.13.2
          cd win
          pyinstaller --onefile --windowed --name Tanzil-PC --icon icon.ico --add-data "icon.ico;." --splash splash.png tanzil_pc.py
          Get-ChildItem -Recurse build -Filter *.toc | ForEach-Object { Select-String -Path $_.FullName -Pattern 'api-ms-win-crt|ucrtbase|vcruntime140|python37.dll|tcl86t' -SimpleMatch:$false | ForEach-Object { $_.Line.Trim() } } | Sort-Object -Unique | Select-Object -First 40
          Compress-Archive -Path dist\Tanzil-PC.exe -DestinationPath Tanzil-PC-win32.zip
          Get-ChildItem dist, Tanzil-PC-win32.zip | Format-Table Name, Length
      - name: selftest
        shell: pwsh
        run: |
          cd win\dist
          $p = Start-Process -FilePath .\Tanzil-PC.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          "exit $($p.ExitCode)"
      - name: gui screenshots
        shell: pwsh
        run: |
          cd win\dist
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($t in 0,1) {
            $th = @('dark','light')[$t]
            $p = Start-Process -FilePath .\Tanzil-PC.exe -ArgumentList '--tab',$t,'--theme',$th -PassThru
            Start-Sleep -Seconds 6
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\..\..\shot$t.png")
            "tab $t alive: $(-not $p.HasExited)"
            Stop-Process -Id $p.Id -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shot*.png
      - name: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" win/Tanzil-PC-win32.zip win/dist/Tanzil-PC.exe --repo "${{ github.repository }}" --title "تنزيل PC" --notes "مدرب كتابة وتايمر مذاكرة، بدون إنترنت، 32 بت."
