<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فتح في تنزيل</title>
<style>body{font-family:sans-serif;background:#0f1a14;color:#fff;text-align:center;padding:40px 20px}a.b{display:inline-block;margin:14px;padding:14px 26px;background:#2e7d5b;color:#fff;border-radius:12px;text-decoration:none;font-size:18px}small{display:block;opacity:.7;margin-top:18px}</style></head><body>
<h2>صلِّ على النبي 🤍</h2><p id="m">جارٍ فتح تطبيق تنزيل ...</p>
<a class="b" id="go" href="#">افتح في تنزيل</a><br><a class="b" style="background:#444" href="https://github.com/eslamahmedyosef12-cyber/Gooo/releases/latest">التطبيق مش عندي؟ حمّله</a>
<small>لو ما اتفتحش: ارجع للبوت واضغط "أرسل للصندوق"، أو انسخ الرابط والصقه في التطبيق.</small>
<script>
var u=decodeURIComponent((location.hash.match(/u=(.+)$/)||[])[1]||"");
var ok=/^https?:\/\/[^\s]+$/.test(u);
if(!ok){document.getElementById("m").textContent="الرابط غير صالح.";document.getElementById("go").style.display="none";}
else{var i="intent:#Intent;action=android.intent.action.SEND;type=text/plain;package=com.khaznati.khaznati;S.android.intent.extra.TEXT="+encodeURIComponent(u)+";S.browser_fallback_url=https%3A%2F%2Feslamahmedyosef12-cyber.github.io%2FGooo%2Fsite%2F;end";
document.getElementById("go").href=i;setTimeout(function(){location.href=i;},300);}
</script></body></html>
